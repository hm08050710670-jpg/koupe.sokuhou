<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F6F1">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<title>ゴルフコンペ LIVE順位速報</title>
<style>
:root{
  /* GOLF GUTS のロゴの色：濃いブラウン（文字）とクリーム（地色）を基調にしています */
  --gg:linear-gradient(135deg,#9C7A2B 0%,#EBD596 38%,#B8923B 62%,#F6E9C4 100%); --gs:linear-gradient(135deg,#7C8186 0%,#E9EBED 38%,#A4A9AE 62%,#F4F5F6 100%); --gb:linear-gradient(135deg,#7A4A2A 0%,#DDAA84 38%,#A8683F 62%,#EECBAE 100%);   /* 金・銀・銅 */
  --main:#231815; --main2:#4A3B35; --main-soft:#EFE9E0; --main-line:#D8CEC2;
  --ok:#1B6B4A; --ok-soft:#E8F3EC; --ok-line:#C4DFD0;   /* 「保存できた」を示す状態色 */
  --gold:#A9853A; --gold-soft:#F6EFDD;
  --ink:#231815; --muted:#6B615B; --line:#E4DDD3; --bg:#F9F6F1; --bg2:#F1ECE4;
  --red:#B3261E; --red-soft:#FCEDEB; --amber:#8A5A00; --amber-soft:#FFF4D6;
  --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--main2)}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,var(--sar)) 0 max(16px,var(--sal))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- header ---- */
/* 背景：GOLF GUTS のモノグラム柄を全面に。内容は白いカードに載せる */
:root{--gut:12px}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:-160px;z-index:-1;background:var(--tile) 50% 0/62.667px 250.667px;opacity:.17;pointer-events:none}
.brand{position:relative;overflow:hidden;padding:calc(16px + var(--sat)) 0 14px}
.brand::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 44% 96% at 50% 50%,var(--bg) 46%,rgba(249,246,241,0) 84%)}
.brand .wrap{position:relative;z-index:1;display:flex;justify-content:center}
.logo{display:block;width:118px;height:31px;background:var(--logo) center/contain no-repeat}
.backbtn{position:absolute;left:var(--gut);top:50%;transform:translateY(-50%);min-height:40px;padding:6px 13px 6px 9px;border-radius:999px;border:1px solid var(--main-line);background:#fff;color:var(--ink);font-size:14px;font-weight:700;line-height:1;white-space:nowrap}
.backbtn:active{background:var(--main-soft)}
[data-screen="rep"] .brand{padding:calc(9px + var(--sat)) 0 8px}
[data-screen="rep"] .logo{width:92px;height:24px}
.bar,.goldline,#app > .demo,#app > .offline,#offWrap > .offline,#app > .wrap,#app > main.wrap{width:calc(100% - 2*var(--gut));max-width:560px;margin-left:auto;margin-right:auto}
.bar{background:#fff;color:var(--ink);border:1px solid var(--main-line);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 0 16px}
[data-screen="rep"] .bar{padding:14px 0 12px}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-t{font-size:18px;font-weight:700;line-height:1.3;word-break:break-word;text-wrap:balance}
.bar-s{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
[data-screen="viewer"] .bar-t{font-size:29px;font-weight:800;line-height:1.22;letter-spacing:.01em}
[data-screen="home"] .bar-t{font-size:24px;font-weight:800;line-height:1.25}
[data-screen="viewer"] .bar-s,[data-screen="home"] .bar-s{font-size:14px;margin-top:7px}
[data-screen="rep"] .bar-s{font-size:14px;font-weight:600}
.bar-link{flex:none;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:8px 14px;white-space:nowrap}
.goldline{height:3px;background:var(--gold)}
#app > .wrap,#app > main.wrap{display:flow-root;background:#fff;border:1px solid var(--main-line);border-top:0;border-radius:0 0 18px 18px;margin-bottom:22px;padding-bottom:4px}
#app > .wrap:first-child{border-top:1px solid var(--main-line);border-radius:18px;margin-top:calc(16px + var(--sat))}
#app > main.wrap.rep{margin-bottom:calc(290px + var(--sab))}   /* 画面下に固定した保存ボタンのぶんの余白 */
#app > .demo,#app > .offline,#offWrap > .offline{border-left:1px solid var(--main-line);border-right:1px solid var(--main-line)}
@media (max-width:359px){
  :root{--gut:6px}
  #app .champ > i.bgs{font-size:13px;padding:5px 4px 5px 6px;top:9px;left:8px;border-width:2px}   /* 幅の狭い端末では、スタンプが王冠に掛からないよう少し小さく */
  #app .champ > i.stamp{font-size:16px;padding:6px 5px 6px 8px;top:9px;right:8px;border-width:2px}
  #app > .wrap,#app > main.wrap,.bar .wrap{padding-left:12px;padding-right:12px}
}
.demo{background:var(--gold-soft);color:#5E4712;font-size:13px;padding:8px 0;border-bottom:1px solid #E6D7AE}
.offline{background:var(--amber-soft);color:var(--amber);font-size:14px;font-weight:600;padding:8px 0;border-bottom:1px solid #EBD592}

/* ---- common ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--main-line);background:#fff;color:var(--main);font-weight:600;font-size:15px;text-decoration:none}
.btn:active{background:var(--main-soft)}
.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
.btn.primary:active{background:var(--main2)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:60px;font-size:20px;border-radius:14px}
.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.btn.danger{color:var(--red);border-color:#E8C4C0}
.btn[disabled]{opacity:.45;cursor:default}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:var(--bg)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--main)}
.card h3{margin:0 0 6px;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.field{margin:12px 0}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.inp{width:100%;min-height:46px;border:1px solid #CFC6BA;border-radius:10px;padding:8px 12px;background:#fff;font-size:16px}
textarea.inp{min-height:180px;line-height:1.6}
.inp:focus,.sinput:focus,select:focus{outline:2px solid var(--main2);outline-offset:1px}
.msg{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px;font-weight:600}
.msg.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.msg.warn{background:var(--amber-soft);color:var(--amber);border:1px solid #EBD592}
.msg.err{background:var(--red-soft);color:var(--red);border:1px solid #EFC6C2}
.msg small{display:block;font-weight:400;margin-top:4px;font-size:13px}
.center{text-align:center}
.pad{padding:28px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* ---- leaderboard ---- */
.livehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 4px}
.live{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;color:var(--main);letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;background:#1DA35F;flex:none}
.dot.off{background:#BDB4AA}
.badge{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid var(--gold);color:#7A5E1E;background:var(--gold-soft);white-space:nowrap}
.badge.final{background:var(--main);border-color:var(--main);color:#fff}
.note{font-size:13px;color:var(--muted);margin:2px 0 10px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--main-line);background:#fff;color:var(--main);font-weight:700;font-size:14px;padding:6px 4px}
.tabs button.on{background:var(--main);border-color:var(--main);color:#fff}
.lb{border-top:2px solid var(--main);margin:0 0 6px}
.lbh,.lbr{display:grid;grid-template-columns:58px minmax(0,1fr) 62px 78px;align-items:center;column-gap:6px}
.lbh{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.lbh span:nth-child(3),.lbh span:nth-child(4){text-align:right}
.lbr{padding:10px 0;border-bottom:1px solid var(--line);min-height:58px}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:50px;height:34px;border-radius:999px;font-weight:800;font-size:17px;color:var(--ink)}
.rk small{font-size:12px;font-weight:700;margin-left:1px}
.rk.r1{background:var(--gold);color:#fff}
.rk.r2{background:#938D87;color:#fff}
.rk.r3{background:#A8724C;color:#fff}
.rk.none{color:#A89F96;font-weight:600}
.pn{font-size:18px;font-weight:700;line-height:1.3;word-break:break-word}
.top .pn{font-size:19px}
.pg{font-size:12px;color:var(--muted);font-weight:500}
.sc{text-align:right;font-size:24px;font-weight:800;line-height:1.1}
.sc.under{color:var(--red)} .sc.even{color:var(--ink)} .sc.over{color:var(--ink)}
.sc small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hl{text-align:right;font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.hl b{font-size:16px;color:var(--ink)}
.hl.fin{color:var(--main2)}
.lbr.wait .pn{font-weight:500;color:var(--muted)}
.sect{font-size:13px;font-weight:700;color:var(--muted);background:var(--bg2);padding:6px 10px;border-radius:8px;margin:14px 0 0}
.foot{font-size:13px;color:var(--muted);text-align:center;padding:14px 0 calc(28px + var(--sab))}
.foot b{color:var(--ink)}
.backrep{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 30%);padding:18px 0 calc(12px + var(--sab))}

/* ---- score input ---- */
.holehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px;background:var(--main-soft);border:1px solid var(--main-line);border-radius:16px;padding:10px}
.navb{flex:none;width:56px;height:64px;border-radius:12px;border:1px solid var(--main-line);background:#fff;color:var(--main);font-size:30px;font-weight:700;line-height:1}
.navb[disabled]{opacity:.3}
.hinfo{text-align:center}
.hno{font-size:40px;font-weight:800;color:var(--main);line-height:1.05}
.hno small{font-size:18px;font-weight:700;margin-left:2px}
.hpar{font-size:20px;font-weight:800;color:#7A5E1E;letter-spacing:.04em}
.hedit{font-size:12px;font-weight:700;color:var(--amber)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sname{font-size:20px;font-weight:700;min-width:0;word-break:break-word;line-height:1.3}
.stepper{flex:none;display:flex;align-items:center;gap:8px}
.stb{width:60px;height:60px;border-radius:14px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:34px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.stb:active{background:var(--main);color:#fff}
.sinput{width:70px;height:60px;border-radius:14px;border:2px solid #CFC6BA;background:#fff;text-align:center;font-size:36px;font-weight:800;padding:0}
.sinput.empty{border-style:dashed;color:#A89F96}
.sinput::placeholder{color:#BDB4AA;font-weight:500}
.striplabel{font-size:12px;color:var(--muted);margin:16px 0 6px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.chip{height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;font-weight:700;padding:0;position:relative}
.chip.done{background:var(--main);border-color:var(--main);color:#fff}
.chip.part{border:2px solid #D9A400;color:var(--amber);background:var(--amber-soft)}
.chip.pend{background:#D9A400;border-color:#D9A400;color:#fff}
.chip.cur{box-shadow:0 0 0 3px var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--sab));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.savebar .msg{margin:0 0 8px}
.donebox{text-align:center;border:2px solid var(--main);border-radius:16px;padding:22px 16px;margin:16px 0}
.donebox .dtitle{font-size:20px;font-weight:800;color:var(--main);text-wrap:balance}

/* ---- admin / editor ---- */
.atabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 4px}
.atabs button{min-height:46px;border-radius:10px;border:1px solid var(--main-line);background:#fff;color:var(--main);font-weight:700;font-size:13px;padding:4px 2px;line-height:1.25}
.atabs button.on{background:var(--main);border-color:var(--main);color:#fff}
.url{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;color:var(--muted);word-break:break-all;background:var(--bg2);border-radius:8px;padding:8px 10px;margin:6px 0 8px}
#adminCard{background:var(--main);border-color:var(--main)}   /* 幹事用URLの枠だけ、濃いブラウンにして見分けやすく */
#adminCard h2{color:#fff}
#adminCard .hint{color:#E2D8CB}
#adminCard .hint b{color:#fff}
#adminCard .url{background:rgba(255,255,255,.12);color:#F3E9DA}
.prog{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--main2);border-radius:99px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ghead b{font-size:17px;color:var(--main)}
.ghead select,.prow select{min-height:44px;border:1px solid #CFC6BA;border-radius:10px;background:#fff;padding:4px 8px;font-size:16px}
.prow{display:flex;gap:6px;align-items:center;margin:6px 0}
.prow .inp{flex:1 1 auto;min-width:0}
.prow select{flex:none;width:84px}
.xbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid #E8C4C0;background:#fff;color:var(--red);font-size:20px;font-weight:700;padding:0}
.pars{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:4px 0 10px}
.parc{border:1px solid var(--main-line);border-radius:10px;background:#fff;padding:4px 0 6px;text-align:center}
.parc span{display:block;font-size:11px;color:var(--muted)}
.parc b{display:block;font-size:20px;color:var(--main)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scell{border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;display:block}
.scell span{display:block;font-size:12px;color:var(--muted);line-height:1.4;white-space:nowrap;margin-bottom:4px}
.scell span b{font-size:15px;color:var(--ink);margin-right:4px}
.scell input{display:block;width:100%;height:46px;border:1px solid #CFC6BA;border-radius:8px;text-align:center;font-size:22px;font-weight:700;padding:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 50px 62px 66px;gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.frow .inp{min-height:44px;padding:6px 2px;text-align:center}
.frow.h{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;font-weight:600}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--main)}
.chk small{display:block;font-weight:400;color:var(--muted);font-size:13px}
/* 新ペリア：隠しホールの選択（幹事のみ） */
.hgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:4px 0 8px}
.hbtn{border:1px solid var(--main-line);border-radius:10px;background:#fff;color:var(--ink);padding:5px 0 4px;text-align:center}
.hbtn b{display:block;font-size:17px;line-height:1.15}
.hbtn span{display:block;font-size:10px;color:var(--muted)}
.hbtn.on{background:var(--main);border-color:var(--main);color:#fff}
.hbtn.on span{color:rgba(255,255,255,.75)}
.sel{width:100%;min-height:46px;border:1px solid #CFC6BA;border-radius:10px;padding:6px 10px;background:#fff;font-size:16px}
/* 結果発表 */
[data-screen="result"] .bar-t{font-size:29px;font-weight:800;line-height:1.22;letter-spacing:.01em}
[data-screen="result"] .bar-s{font-size:14px;margin-top:5px}
[data-screen="result"] .bar{padding:16px 0 13px}
#app{--rk:1}   /* 結果発表の上位3名の詰め具合（画面の高さに合わせて自動調整。1＝標準） */
.res-h{text-align:center;padding:calc(22px*var(--rk)) 0 calc(14px*var(--rk))}
.res-en{display:block;font-size:12px;font-weight:800;letter-spacing:.34em;color:var(--gold);padding-left:.34em}
.res-h h1{margin:4px 0 2px;font-size:26px;font-weight:800;letter-spacing:.08em}
.res-m{font-size:13px;color:var(--muted)}
.nw{white-space:nowrap}   /* フルネームは「姓」「名」の間でだけ折り返す */
/* 上位3名：明るい地に、王冠と金のリボン（優勝）、銀・銅のメダル（準優勝・3位） */
.champ{position:relative;overflow:hidden;border-radius:22px;padding:calc(18px*var(--rk)) 14px calc(22px*var(--rk));text-align:center;border:2.5px solid transparent;background:linear-gradient(#FFFEFA,#FBF5E6) padding-box,var(--gg) border-box;box-shadow:0 8px 22px rgba(156,122,43,.18)}
.champ-pat{position:absolute;top:0;left:0;right:0;bottom:0;background:#B8923B;-webkit-mask:var(--tile) 50% 0/62.667px 250.667px;mask:var(--tile) 50% 0/62.667px 250.667px;opacity:.13}
.champ > *:not(.champ-pat){position:relative}
.champ > i.stamp{position:absolute;top:10px;right:10px;transform:rotate(12deg);font-style:normal;font-size:20px;font-weight:800;line-height:1;letter-spacing:.2em;padding:7px 6px 7px 10px;border:2.5px solid var(--muted);border-radius:8px;color:var(--muted);background:rgba(255,255,255,.72);opacity:.9}
.champ .ic-win{display:block;margin:0 auto;width:calc(156px*var(--rk));height:calc(141.4px*var(--rk));filter:drop-shadow(0 3px 5px rgba(120,90,20,.26))}
.champ-n{font-size:calc(42px*var(--rk));font-weight:800;line-height:1.2;margin-top:calc(8px*var(--rk));word-break:break-word}
.champ-g{font-size:13px;color:var(--muted)}
.champ-s{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:calc(10px*var(--rk))}
.champ-s small{font-size:13px;font-weight:800;letter-spacing:.14em;color:#8A6A1F}
.champ-s b{font-size:calc(54px*var(--rk));font-weight:800;line-height:1;color:#8A6A1F;background:linear-gradient(135deg,#7E6020,#C9A24A 45%,#8A6A1F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.champ-d{font-size:13px;color:var(--muted);margin-top:calc(8px*var(--rk))}
.pods{margin:calc(12px*var(--rk)) 0 6px;display:grid;gap:calc(10px*var(--rk))}
.pod{display:flex;align-items:center;gap:12px;border-radius:16px;padding:calc(10px*var(--rk)*var(--rk)) 14px calc(10px*var(--rk)*var(--rk)) 12px;border:2px solid transparent;background:linear-gradient(#fff,#F8F8F8) padding-box,var(--gs) border-box;box-shadow:0 4px 12px rgba(35,24,21,.07);min-width:0}
.pod.b{background:linear-gradient(#fff,#FBF4EE) padding-box,var(--gb) border-box}
.pod .ic-medal{flex:none;width:calc(42px*var(--rk));height:calc(55px*var(--rk));filter:drop-shadow(0 2px 4px rgba(35,24,21,.2))}
.pod-who{flex:1 1 auto;min-width:0;text-align:left}
.pod-l{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.pod-n{font-size:calc(23px*var(--rk));font-weight:800;line-height:1.25;word-break:break-word}
.pod-g{font-size:12px;color:var(--muted);line-height:calc(1.5*var(--rk))}
.pod-sc{flex:none;text-align:right}
.pod-s small{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);margin-right:4px}
.pod-s b{font-size:calc(28px*var(--rk));font-weight:800}
.pod-d{font-size:11.5px;color:var(--muted);line-height:calc(1.5*var(--rk))}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.bgs{display:inline-block;font-style:normal;font-size:11px;font-weight:800;line-height:1.3;letter-spacing:.06em;white-space:nowrap;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:1px 4px 1px 6px;margin-left:6px;vertical-align:2px;transform:rotate(-6deg);background:rgba(255,255,255,.75)}   /* ベスグロのスタンプ */
.champ > i.bgs{position:absolute;top:11px;left:10px;margin:0;font-size:16px;line-height:1;letter-spacing:.1em;padding:7px 5px 7px 8px;border-width:2.5px;border-radius:8px;transform:rotate(-12deg);opacity:.92}
.tag.bb{background:var(--main-soft);color:var(--ink);border:1px solid var(--main-line)}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 2px}
.award{border:1px solid var(--main-line);border-radius:14px;padding:10px 12px;background:#fff;min-width:0}
.award > span{display:block;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.06em}
.award b{display:block;font-size:17px;line-height:1.3;word-break:break-word}
.award small{font-size:12px;color:var(--muted)}
.hid{margin:16px 0 4px;border-top:1px solid var(--line);padding-top:12px}
.hid-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.hid-c{display:flex;flex-wrap:wrap;gap:6px}
.hid-c span{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 6px;border-radius:8px;background:var(--main);color:#fff;font-weight:800;font-size:14px}
/* 印刷（PDF保存）用の成績表：画面では非表示、結果発表ページを印刷したときだけ出る */
.print-sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 12mm}
  html,body{background:#fff !important}
  body::before{display:none !important}
  .toast,.ov{display:none !important}
  #app[data-screen="result"] > :not(.print-sheet){display:none !important}
  .print-sheet{display:block;color:#000;font-size:10.5pt;line-height:1.45}
  .ps-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14pt;border-bottom:1.6pt solid #231815;padding-bottom:8pt;margin-bottom:6pt}
  .ps-logo{width:118pt;height:auto;flex:none}
  .ps-title{font-size:17pt;font-weight:800;line-height:1.25;text-align:right}
  .ps-sub{font-size:9.5pt;color:#333;text-align:right;margin-top:2pt}
  .ps-kind{font-size:10pt;font-weight:700;margin:8pt 0 5pt}
  .ps-table{width:100%;border-collapse:collapse}
  .ps-table thead{display:table-header-group}
  .ps-table tr{break-inside:avoid;page-break-inside:avoid}
  .ps-table th{font-size:8.5pt;font-weight:700;color:#333;border-bottom:1pt solid #231815;padding:4pt 4pt;text-align:center;white-space:nowrap}
  .ps-table td{border-bottom:.5pt solid #BBB;padding:3pt 4pt;text-align:center;font-variant-numeric:tabular-nums}
  .ps-table .l{text-align:left}
  .ps-table .rk{display:inline;min-width:0;height:auto;background:none !important;color:#000 !important;font-size:10.5pt;font-weight:700}
  .ps-table td.net{font-weight:800;font-size:11.5pt}
  .ps-table tr.top td{font-weight:700}
  .ps-table td.nm{font-weight:700}
  .ps-table .aw{font-size:8pt;font-weight:700;border:.6pt solid #555;border-radius:8pt;padding:0 4pt;margin-left:4pt;white-space:nowrap}
  .ps-notes{margin-top:7pt;font-size:9pt;color:#222}
  .ps-notes div{margin-top:2.5pt}
  .ps-foot{margin-top:8pt;padding-top:4pt;border-top:.5pt solid #999;font-size:8pt;color:#555;display:flex;justify-content:space-between}
}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:10px 0;border-bottom:1px solid var(--line)}

/* ---- overlay ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.ovbox{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.ovbox p{margin:0 0 16px;font-size:16px;white-space:pre-line}
.ovbox .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:rgba(35,24,21,.94);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:60;max-width:90vw;text-align:center}
</style>

/* ---------- golf logic ---------- */
const holeOrder = start => Array.from({length:18}, (_, i) => ((start - 1 + i) % 18) + 1);
const startLabel = s => s === 1 ? '1番（OUT）' : s === 10 ? '10番（IN）' : `${s}番`;
const fmtDiff = d => d === 0 ? 'E' : d > 0 ? `＋${d}` : `－${-d}`;

const scoreOf = (scores, pid, h) => { const v = scores && scores[pid] && scores[pid]['h'+h]; return (typeof v === 'number' && v >= 1) ? v : null; };
function parsOf(pub){ const s = String((pub && pub.pars) || ''); return Array.from({length:18}, (_, i) => +s[i] || DEFAULT_PARS[i]); }
function sortedGroups(pub){ return Object.entries((pub && pub.groups) || {}).map(([id,g]) => ({id, n:+g.n || 0, start:+g.start || 1})).sort((a,b) => a.n - b.n); }
function sortedPlayers(pub, gid){
  const gn = Object.fromEntries(sortedGroups(pub).map(g => [g.id, g.n]));
  return Object.entries((pub && pub.players) || {}).map(([id,p]) => ({id, name:p.name, g:p.g, o:+p.o || 0, gn: gn[p.g] || 0}))
    .filter(p => !gid || p.g === gid).sort((a,b) => a.gn - b.gn || a.o - b.o);
}
/* 未入力ホールは計算に含めない（0打扱いにしない） */
function computeBoard(pub, scores){
  const pars = parsOf(pub); let lastU = 0;
  const rows = sortedPlayers(pub).map(p => {
    let holes = 0, strokes = 0, par = 0;
    for (let h = 1; h <= 18; h++){ const v = scoreOf(scores, p.id, h); if (v !== null){ holes++; strokes += v; par += pars[h-1]; } }
    const u = scores && scores[p.id] && scores[p.id].u; if (typeof u === 'number' && u > lastU) lastU = u;
    return {...p, holes, strokes, par, diff: strokes - par};
  });
  const allDone = rows.length > 0 && rows.every(r => r.holes === 18);
  const closed = !!(pub && pub.final && pub.final.closed);
  const isFinal = allDone || closed;
  const ranked = rows.filter(r => isFinal ? r.holes === 18 : r.holes > 0);
  const rest = rows.filter(r => !ranked.includes(r));
  ranked.sort((a,b) => a.diff - b.diff || b.holes - a.holes || a.gn - b.gn || a.o - b.o);
  let prev = null, rank = 0;
  ranked.forEach((r,i) => { if (prev === null || r.diff !== prev){ rank = i + 1; prev = r.diff; } r.rank = rank; });
  rest.sort((a,b) => b.holes - a.holes || a.gn - b.gn || a.o - b.o);
  return {ranked, rest, isFinal, allDone, lastU, started: rows.some(r => r.holes > 0)};
}

  const ps = sortedPlayers(pub, g.id); const order = holeOrder(g.start);
  let done = 0; const partial = [];
  for (const h of order){ const n = ps.filter(p => scoreOf(scores, p.id, h) !== null).length;
    if (ps.length && n === ps.length) done++; else if (n > 0) partial.push(h); }
  const next = order.find(h => ps.every(p => scoreOf(scores, p.id, h) === null));
  return {players: ps, done, partial, next};
}

/* ---------- 新ペリア方式（ハンディキャップ）の計算 ----------
   HDCP ＝（隠しホールの合計打数 × 18÷隠しホール数 − コースのPAR）× 0.8　　NET ＝ グロス − HDCP
   小数の誤差を出さないよう、内部では10倍した整数で計算する */
const PEORIA_KINDS = {12: '新ペリア（隠しホール12）', 9: '新新ペリア（隠しホール9）', 6: 'ペリア（隠しホール6）'};
const PEORIA_CAPS = {double: 'ダブルパーまで（PARの2倍）', triple: 'トリプルボギーまで（PAR＋3）', none: '上限なし（打数そのまま）'};
const fmt1 = t => (t / 10).toFixed(1);
const peoriaDefaults = () => ({kind: 12, holes: '0'.repeat(18), cap: 'double', maxHc: 36, tie: 'hc'});
function hiddenList(holes){ const a = []; for (let h = 1; h <= 18; h++) if (String(holes || '')[h-1] === '1') a.push(h); return a; }
/* OUT・INから半分ずつ、PAR合計が標準（PAR72・新ペリアなら48）になる組み合わせをランダムに選ぶ */
function pickHidden(pars, kind){
  const total = pars.reduce((a,b) => a + b, 0); const target = Math.round(total * kind / 18);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let best = null, bestGap = Infinity;
  for (let t = 0; t < 4000 && bestGap > 0; t++){
    const nOut = kind % 2 === 0 ? kind / 2 : (Math.random() < .5 ? Math.floor(kind / 2) : Math.ceil(kind / 2));
    const pick = [...shuffle([1,2,3,4,5,6,7,8,9]).slice(0, nOut), ...shuffle([10,11,12,13,14,15,16,17,18]).slice(0, kind - nOut)];
    const gap = Math.abs(pick.reduce((x,h) => x + pars[h-1], 0) - target);
    if (gap < bestGap){ best = pick; bestGap = gap; }
  }
  return Array.from({length: 18}, (_, i) => best.includes(i + 1) ? '1' : '0').join('');
}
function calcPeoria(pub, scores, cfg){
  const pars = parsOf(pub); const parTotal = pars.reduce((a,b) => a + b, 0);
  const hidden = hiddenList(cfg.holes); const n = hidden.length;
  const rows = sortedPlayers(pub).map(p => {
    let gross = 0, done = true;
    for (let h = 1; h <= 18; h++){ const v = scoreOf(scores, p.id, h); if (v === null) done = false; else gross += v; }
    if (!done || !n) return {...p, ok: false};
    let hs = 0;   /* 隠しホールの合計（上限の設定があれば、ハンディキャップの計算にだけ適用） */
    for (const h of hidden){ const v = scoreOf(scores, p.id, h), par = pars[h-1]; hs += cfg.cap === 'double' ? Math.min(v, par * 2) : cfg.cap === 'triple' ? Math.min(v, par + 3) : v; }
    let hc10 = Math.round((hs * 18 / n - parTotal) * 8);
    if (cfg.maxHc && hc10 > cfg.maxHc * 10) hc10 = cfg.maxHc * 10;
    return {...p, ok: true, gross, hs, hc10, net10: gross * 10 - hc10};
  });
  const ranked = rows.filter(r => r.ok).sort((a,b) => a.net10 - b.net10 || a.hc10 - b.hc10 || a.gn - b.gn || a.o - b.o);
  const key = r => cfg.tie === 'tie' ? String(r.net10) : r.net10 + ':' + r.hc10;   /* 同NETのとき：ハンデの少ない人を上位／同順位 */
  let prev = null, rank = 0; ranked.forEach((r,i) => { if (key(r) !== prev){ rank = i + 1; prev = key(r); } r.rank = rank; });
  return {ranked, skipped: rows.filter(r => !r.ok), n, hiddenPar: hidden.reduce((x,h) => x + pars[h-1], 0), parTotal};
}
/* ベスグロ：18ホールそろった人のうち最少打数の人（同打数は全員）。幹事が同打数の中から選んだ場合は、その人だけにする */
function bestGrossOf(pub, scores, pick){
  const done = sortedPlayers(pub).map(p => { let g = 0, n = 0; for (let h = 1; h <= 18; h++){ const v = scoreOf(scores, p.id, h); if (v !== null){ n++; g += v; } } return {...p, gross: g, done: n === 18}; }).filter(p => p.done);
  if (!done.length) return {tied: [], chosen: [], best: null};
  const best = Math.min(...done.map(p => p.gross)); const tied = done.filter(p => p.gross === best);
  const sel = tied.filter(p => pick && pick[p.id]);   /* 選択が今の同打数の人に当てはまらなければ（スコアが変わった等）、全員に戻す */
  return {tied, chosen: sel.length ? sel : tied, best};
}
/* 結果発表・成績表のためのデータをまとめる（公開済みの結果、または幹事だけが見られる未公開の結果） */
function resultModel(pub, scores, privFinal){
  const pars = parsOf(pub); const b = computeBoard(pub, scores); const f = pub.final || {};

  const pubRows = f.published && has(f.rows) ? f.rows : null; const prvRows = privFinal && has(privFinal.rows) ? privFinal.rows : null;
  const src = pubRows || prvRows;
  const card = sortedPlayers(pub).map(p => { let o = 0, i = 0, n = 0;
    for (let h = 1; h <= 18; h++){ const v = scoreOf(scores, p.id, h); if (v !== null){ n++; if (h <= 9) o += v; else i += v; } }
    return {...p, done: n === 18, out: o, inn: i, gross: o + i, diff: o + i - pars.reduce((a,x) => a + x, 0)}; });
  let mode = '', list = [], rest = [];
  if (src){ mode = 'peoria';
    list = card.filter(p => src[p.id] && +src[p.id].rank > 0).map(p => ({...p, rank: +src[p.id].rank, net: src[p.id].net ?? '', hc: src[p.id].hc ?? ''}))
      .sort((x,y) => x.rank - y.rank || (parseFloat(x.net) || 0) - (parseFloat(y.net) || 0) || x.gn - y.gn || x.o - y.o);
    rest = card.filter(p => !list.some(x => x.id === p.id));
  } else if (b.isFinal && b.ranked.length){ mode = 'gross';
    const rk = Object.fromEntries(b.ranked.map(r => [r.id, r.rank]));
    list = card.filter(p => rk[p.id]).map(p => ({...p, rank: rk[p.id], net: '', hc: ''})).sort((x,y) => x.rank - y.rank || x.gn - y.gn || x.o - y.o);
    rest = card.filter(p => !rk[p.id]);
  }
  const bg = bestGrossOf(pub, scores, f.bg); const chosenIds = new Set(bg.chosen.map(p => p.id)); const bestG = bg.best;

  return {mode, list, rest, preview: !!src && !pubRows, hasHc, kind: +(f.kind || (privFinal && privFinal.kind)) || 12,
    hidden: mode === 'peoria' && hasHc ? hiddenList(holes) : [], bestGross: card.filter(p => chosenIds.has(p.id)), bestG,
    booby: list.length >= 3 ? list[list.length - 2] : null};
}

async function createFirebaseStore(cfg){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, dbM, authM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-database.js'), import(base+'firebase-auth.js')]);

  const auth = authM.getAuth(fb);
  const authReady = new Promise(res => { let off = null, done = false;
    off = authM.onAuthStateChanged(auth, () => { if (done) return; done = true; res(); if (off) off(); }, () => res());
    setTimeout(res, 10000); });
  let uidP = null;
  return {
    mode: 'firebase',
    watch(path, cb, onErr){ return dbM.onValue(dbM.ref(db, path), s => cb(s.val()), e => { if (onErr) onErr(e); }); },
    get(path){ return dbM.get(dbM.ref(db, path)).then(s => s.val()); },
    set(path, v){ return dbM.set(dbM.ref(db, path), v); },
    update(path, obj){ return dbM.update(dbM.ref(db, path), obj); },
    now(){ return dbM.serverTimestamp(); },
    onConn(cb){ return dbM.onValue(dbM.ref(db, '.info/connected'), s => cb(s.val() === true)); },
    async who(){ await authReady; return auth.currentUser ? auth.currentUser.uid : null; },   /* サインイン済みなら uid、していなければ null（新しくサインインはしない） */
    uid(){ if (!uidP) uidP = (async () => { await authReady; if (!auth.currentUser) await authM.signInAnonymously(auth); return auth.currentUser.uid; })().catch(e => { uidP = null; throw e; }); return uidP; }
  };
}
/* ---------- data store: demo (this device only) ---------- */
function createLocalStore(){
  const KEY = 'golflive:demo-db'; let memTree = {};
  const load = () => { try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : memTree; }catch(e){ return memTree; } };
  const persist = () => { memTree = tree; try{ localStorage.setItem(KEY, JSON.stringify(tree)); }catch(e){} };
  let tree = load(); const watchers = new Set();

  const setAt = (t, p, v) => { const ks = seg(p); let n = t; const trail = [];
    for (let i = 0; i < ks.length - 1; i++){ if (n[ks[i]] === null || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; trail.push([n, ks[i]]); n = n[ks[i]]; }
    const last = ks[ks.length-1];
    if (v === null || v === undefined) delete n[last]; else n[last] = JSON.parse(JSON.stringify(v));
    for (let i = trail.length - 1; i >= 0; i--){ const [par, k] = trail[i]; if (par[k] && typeof par[k] === 'object' && !Object.keys(par[k]).length) delete par[k]; else break; } };

  const notify = () => { for (const w of [...watchers]) { try{ w.cb(JSON.parse(JSON.stringify(getAt(tree, w.path)))); }catch(e){ console.error(e); } } };
  try{ window.addEventListener('storage', e => { if (e.key === KEY){ tree = load(); notify(); } }); }catch(e){}

  const denied = () => Object.assign(new Error('PERMISSION_DENIED'), {code:'PERMISSION_DENIED'});

  const check = (path, v) => { const m = /^comps\/([^/]+)\/(admins|members)\/([^/]+)$/.exec(seg(path).join('/')); if (!m || v === null) return;
    if (!getAt(tree, `comps/${m[1]}/private`)) return;
    if (m[2] === 'admins' && v.k !== getAt(tree, `comps/${m[1]}/private/adminKey`)) throw denied();
    if (m[2] === 'members' && v.k !== getAt(tree, `comps/${m[1]}/private/groupKeys/${v.g}`)) throw denied(); };
  const apply = ops => new Promise((res, rej) => { try{ tree = load(); for (const [p, v] of ops) check(p, v);
      for (const [p, v] of ops) setAt(tree, p, stamp(v)); persist(); notify(); setTimeout(res, 0); }catch(e){ rej(e); } });
  return {
    mode: 'demo',
    watch(path, cb){ const w = {path, cb}; watchers.add(w); setTimeout(() => { if (watchers.has(w)) cb(JSON.parse(JSON.stringify(getAt(tree, path)))); }, 0); return () => watchers.delete(w); },

      return Promise.resolve(JSON.parse(JSON.stringify(getAt(t, path)))); },
    set(path, v){ return apply([[path, v]]); },
    update(path, obj){ return apply(Object.entries(obj).map(([k, v]) => [path + '/' + k, v])); },
    now(){ return {__ts: 1}; },
    onConn(cb){ setTimeout(() => cb(true), 0); return () => {}; },

  };

/* 結果発表：スクロール前の画面に上位3名が収まり、その下に4位以下が少しのぞくように、上位3名の詰め具合を調整する。
   画面が十分に高ければ標準のまま。低い画面では 0.8 倍まで詰め、それでも入らなければ「3位まで見える」ことを優先する（0.74 倍まで） */
function fitFirstView(root){
  app.style.setProperty('--rk', '1');
  const pods = root.querySelectorAll('.pod'); const last3 = pods.length ? pods[pods.length - 1] : root.querySelector('#champ'); if (!last3) return;
  const next = root.querySelector('#resList .lbr') || root.querySelector('.awards');
  const vh = window.innerHeight, y = n => n.getBoundingClientRect(), sy = window.scrollY;
  const okPeek = () => !next || y(next).top + sy <= vh - 34, okTop3 = () => y(last3).bottom + sy <= vh - 10;
  const tryGoal = (ok, min) => { for (let k = 100; k >= min; k -= 2){ app.style.setProperty('--rk', String(k / 100)); if (ok()) return true; } return false; };
  if (tryGoal(okPeek, 80)) return;
  if (tryGoal(okTop3, 74)) return;   /* 4位までは無理でも、3位までは収める（もう少しだけ詰める） */
  app.style.setProperty('--rk', '.9');
}
/* コンペ名を、1行に収まる範囲でできるだけ大きく表示する（長い名前は自動で少し小さくし、それでも入らなければ折り返す） */
function fitTitle(root){ fitLine(root.querySelector('.bar-t'), 21); }
const simplePage = (title, bodyHtml) => `${pageHead(title)}<div class="wrap">${bodyHtml}</div>`;

async function boot(){
  const cfg = window.FIREBASE_CONFIG;
  const configured = cfg && typeof cfg === 'object' && cfg.apiKey;
  try{
    if (configured){
      if (!cfg.databaseURL) throw Object.assign(new Error('接続設定に databaseURL がありません。Firebase コンソールで Realtime Database を作成してから、設定を貼り直してください。'), {friendly:true});
      store = await withTimeout(createFirebaseStore(cfg), 20000);
    } else store = createLocalStore();
  }catch(e){ console.error(e); bootError = e; }
  window.addEventListener('hashchange', route);
  route();
}

let unmount = null, routeTok = 0;
/* 「戻る」ボタン：アプリ内でたどってきたページがあればそこへ、無ければ（URLを直接開いた場合など）ひとつ上の画面へ戻る */
const navStack = []; let navBack = {show: false, fallback: null}; let leaveGuard = null;
document.addEventListener('click', async e => {
  if (!e.target.closest || !e.target.closest('[data-back]')) return;
  if (leaveGuard && !(await leaveGuard())) return;
  if (navStack.length > 1) history.back(); else if (navBack.fallback !== null) location.hash = navBack.fallback;
});
function route(){
  if (unmount){ try{ unmount(); }catch(e){ console.error(e); } unmount = null; }
  app.onclick = app.oninput = app.onchange = app.onsubmit = null; app.removeAttribute('data-screen');
  routeTok++; window.scrollTo(0, 0); leaveGuard = null; navBack = {show: false, fallback: null};
  { const cur = location.hash.replace(/^#/, '');
    if (navStack.length >= 2 && navStack[navStack.length - 2] === cur) navStack.pop(); else if (navStack[navStack.length - 1] !== cur) navStack.push(cur); }
  if (bootError){
    app.innerHTML = simplePage('ゴルフコンペ LIVE順位速報', `<div class="msg err">${bootError.friendly ? esc(bootError.message) : '読み込みに失敗しました。通信状況を確認して、ページを開き直してください。'}</div><button class="btn primary block" onclick="location.reload()">もう一度読み込む</button>`);
    return;
  }
  let hash = location.hash.replace(/^#\/?/, ''); try{ hash = decodeURIComponent(hash); }catch(e){}
  const parts = hash.trim().split('-');
  const ok = s => /^[a-z0-9]+$/i.test(s || '');
  /* スコア入力画面には出さない（誤タップで入力画面を離れないように。順位速報へは「順位を見る」で行き来できる） */
  if (parts[0] === 'v' && ok(parts[1])) navBack = {show: navStack.length > 1, fallback: null};
  else if (parts[0] === 'r' && ok(parts[1])) navBack = {show: true, fallback: (parts[2] === 'sample' ? 'a-' : 'v-') + parts[1]};   /* 見本は幹事の管理画面へ戻る */
  else if ((parts[0] === 'a' && ok(parts[1])) || parts[0] === 'new') navBack = {show: true, fallback: ''};
  if (parts[0] === 'v' && ok(parts[1])) unmount = mountViewer(app, parts[1]);
  else if (parts[0] === 'g' && ok(parts[1]) && ok(parts[2]) && ok(parts[3])) unmount = mountRep(app, parts[1], parts[2], parts[3]);
  else if (parts[0] === 'a' && ok(parts[1])) unmount = mountAdmin(app, parts[1], ok(parts[2]) ? parts[2] : '');
  else if (parts[0] === 'r' && ok(parts[1])) unmount = mountResult(app, parts[1], parts[2] === 'sample');
  else if (parts[0] === 'new') unmount = mountCreate(app);
  else unmount = mountHome(app);
}

    const b = computeBoard(pub, scores);
    const fin = pub.final || {}; const finRows = fin.rows || {};
    const hasPeoria = !!fin.published && Object.values(finRows).some(r => r && r.rank);
    const cur = hasPeoria ? (tab || 'peoria') : 'gross';

    let h = pageHead(pub.name || 'ゴルフコンペ', sub);
    if (!conn) h += `<div class="offline"><div class="wrap">通信が切れています。つながり次第、自動で最新の順位に更新します。</div></div>`;
    if (unsent()) h += `<div class="offline" id="unsentNote"><div class="wrap">この端末に未送信のスコアがあります。他の人の画面にはまだ反映されていません。</div></div>`;
    h += `<div class="wrap"><div class="livehead"><div class="live"><span class="dot ${conn ? '' : 'off'}"></span><span>LIVE 順位速報</span></div>`;
    h += cur === 'peoria' ? `<span class="badge final" id="statusBadge">最終順位</span>` : b.isFinal ? `<span class="badge final" id="statusBadge">最終結果</span>` : `<span class="badge" id="statusBadge">暫定順位</span>`;
    h += `</div>`;
    if (hasPeoria) h += `<div class="tabs"><button data-tab="peoria" class="${cur === 'peoria' ? 'on' : ''}">新ペリア 最終順位</button><button data-tab="gross" class="${cur === 'gross' ? 'on' : ''}">グロス順位</button></div>`;
    if (hasPeoria || b.isFinal) h += `<a class="btn block" id="toResult" href="#r-${esc(cid)}" style="margin:10px 0">結果発表を見る（印刷・PDF）</a>`;

}

/* 結果発表の「見本」用：実際の参加者名に、仮のスコアをあてはめたデータを作る（どこにも保存しない） */
function makeSampleResult(pub, cid){
  let seed = 0; for (const ch of String(cid)) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const pars = parsOf(pub); const scores = {};
  sortedPlayers(pub).forEach(p => { const skill = 0.55 + rnd() * 0.9; scores[p.id] = {};
    for (let h = 1; h <= 18; h++) scores[p.id]['h' + h] = Math.max(pars[h-1] - 1, Math.round(pars[h-1] + skill + (rnd() + rnd() - 1) * 1.3)); });
  const pick = from => { const a = from.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, 6); };
  const hid = [...pick([1,2,3,4,5,6,7,8,9]), ...pick([10,11,12,13,14,15,16,17,18])];
  const cfg = {...peoriaDefaults(), holes: Array.from({length: 18}, (_, i) => hid.includes(i + 1) ? '1' : '0').join('')};
  const rows = {}; for (const r of calcPeoria(pub, scores, cfg).ranked) rows[r.id] = {rank: r.rank, hc: fmt1(r.hc10), net: fmt1(r.net10)};
  return {pub: {...pub, final: {closed: false, published: true, reveal: true, kind: cfg.kind, holes: cfg.holes, rows}}, scores};
}

  let hole = null, done = false, draft = {}, dirty = false, flash = null, seq = 0;
  const st = {};                       /* ホールごとの状態: saving | pending | error */

  const savePend = () => { Object.keys(pend).length ? ls.setJSON(pendKey, pend) : ls.del(pendKey); };

    for (const p of members()){ const v = pv && (p.id in pv) ? pv[p.id] : scoreOf(scores, p.id, hole); draft[p.id] = (typeof v === 'number') ? v : null; } dirty = false; };
  const pickAfter = h => { const o = order(); const i = h ? o.indexOf(h) : -1;
    for (let k = 1; k <= 18; k++){ const hh = o[(i + k) % 18]; if (hh !== h && filled(hh) === 0 && !pend[hh]) return hh; } return null; };
  let flashT = 0;
  const goto = h => { hole = h; done = (h === null); if (!done) loadDraft(); render(); window.scrollTo(0, 0);
    clearTimeout(flashT); if (flash) flashT = setTimeout(() => { flash = null; const f = el.querySelector('#flash'); if (f) f.remove(); }, 6000); };

  function stripHtml(){
    const o = order();
    return `<div class="striplabel">入力状況（タップでそのホールへ移動・修正できます）</div><div class="strip">` + o.map(h => {

      + `</div><div class="legend"><span><i style="background:var(--main);border-color:var(--main)"></i>保存済み</span><span><i style="background:#D9A400;border-color:#D9A400"></i>未送信</span><span><i style="background:var(--amber-soft);border-color:#D9A400"></i>一部未入力</span></div>`;
  }
  function pendHtml(){

    return `<div class="msg warn" id="pendBar">まだ保存できていないホール：${hs.map(h => h + '番').join('、')}<small>電波が戻ると自動で送信します。このページは閉じないでください。</small><button class="btn" data-resend style="margin-top:8px">いますぐ再送信</button></div>`;
  }
  function statusHtml(){
    const s = st[hole];
    if (s === 'saving') return `<div class="msg ok" id="saveStatus" data-state="saving">保存中…</div>`;
    if (s === 'pending') return `<div class="msg warn" id="saveStatus" data-state="pending">まだ保存できていません（通信待ち）<small>電波が戻ると自動で送信します。このページは閉じないでください。</small></div><button class="btn block" data-skip style="margin-bottom:8px">先に次のホールを入力する</button>`;

        + `<button class="stb" data-step="1" aria-label="${esc(p.name)} 1打増やす">＋</button></div></div>`; }).join('') + `</div>`;
    h += `<div id="stripWrap">${stripHtml()}</div></main>`;
    h += `<footer class="savebar"><div class="wrap"><div id="statusWrap">${statusHtml()}</div><button class="btn primary block big" id="saveBtn" ${st[hole] === 'saving' ? 'disabled' : ''}>${saveLabel()}</button></div></footer>`;
    el.innerHTML = h;

  function light(){ /* 入力中の欄を壊さずに、状態表示だけを更新 */

    const nav = t.closest('[data-nav]') || t.closest('[data-goto]');
    if (nav){
      const o = order(); const target = nav.dataset.goto ? +nav.dataset.goto : o[o.indexOf(hole) + (+nav.dataset.nav)];
      if (!target || (target === hole && !done)) return;
      if (dirty && !done && !(await ask(`${hole}番ホールの入力がまだ保存されていません。\n保存せずに移動しますか？`, '移動する', '戻る'))) return;
      flash = null; goto(target);
    }
  };
  el.oninput = e => { const inp = e.target; if (!inp.classList || !inp.classList.contains('sinput')) return;
    const digits = inp.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '').slice(0, 2);
    let v = digits === '' ? null : parseInt(digits, 10); if (v !== null && v > MAX_STROKES) v = parseInt(digits.slice(-1), 10); if (v === 0) v = null;
    const norm = v === null ? '' : String(v); if (inp.value !== norm) inp.value = norm;
    setRow(inp.closest('.srow').dataset.pid, v); };
  el.addEventListener('focusin', onFocus);
  function onFocus(e){ if (e.target.classList && e.target.classList.contains('sinput')) setTimeout(() => { try{ e.target.select(); }catch(x){} }, 0); }

  const grantKey = `grant:${cid}:${gid}:${key}`;
  function startWatch(){
    if (started || !alive()) return; started = true; phase = 'ok';
    ls.set('rep:' + cid, `g-${cid}-${gid}-${key}`);
    offs.push(store.watch(P(cid, 'pub'), v => { pub = v; gotPub = true; memoSet(cid, 'pub', v); onData(); }, () => { phase = 'bad'; failMsg = 'データを読み込めませんでした。'; render(); }));
    offs.push(store.watch(P(cid, 'scores'), v => { scores = v || {}; gotScores = true; memoSet(cid, 'scores', scores); onData(); }, () => {}));
    if (gotPub && gotScores) onData(); else render();
  }
  (async () => {
    let uid;
    for (;;){
      try{ uid = await withTimeout(store.uid(), 15000); break; }
      catch(e){ console.error(e); if (!alive()) return; const m = authSetupMsg(e); if (m){ phase = 'bad'; failMsg = m; render(); return; }
        slow = true; render(); await new Promise(r => setTimeout(r, 3000)); if (!alive()) return; }
    }
    if (!alive()) return;
    /* 以前この端末で確認済みのURLなら、通信を待たずに入力画面を開く（確認は裏で続ける） */
    if (ls.get(grantKey) === uid) startWatch();
    const slowT = setTimeout(() => { if (alive() && !started){ slow = true; render(); } }, 8000);
    const attempt = n => { let p; try{ p = store.set(P(cid, 'members/' + uid), {g: gid, k: key}); }catch(e){ p = Promise.reject(e); }
      p.then(() => { clearTimeout(slowT); ls.set(grantKey, uid); startWatch(); }, e => {
        console.error(e); if (!alive()) return;
        if (isDenied(e) && n === 0){ setTimeout(() => attempt(1), 900); return; }
        clearTimeout(slowT); ls.del(grantKey); phase = 'bad';
        failMsg = isDenied(e) ? 'この入力用URLは無効です。幹事に正しいURLを確認してください。' : '通信できませんでした。電波の良い場所で、もう一度読み込んでください。';
        render(); }); };
    attempt(0);
  })();
  offs.push(store.onConn(c => { conn = c; if (phase === 'ok' && gotPub && gotScores) light(); }));
  render();
  return () => { offs.forEach(f => f()); clearTimeout(flashT); el.removeEventListener('focusin', onFocus); };
}

function newEd(){ return {name:'', date: todayStr(), course:'', pars:[...DEFAULT_PARS], groups:[], players:[], bulk:'', pw:''}; }
function edFromPub(pub){ return {name: pub.name || '', date: pub.date || '', course: pub.course || '', pars: parsOf(pub),
  groups: sortedGroups(pub).map(g => ({id:g.id, start:g.start})), players: sortedPlayers(pub).map(p => ({id:p.id, name:p.name, g:p.g})), bulk:'', pw:''}; }
function edSplit(ed){
  const names = ed.bulk.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  ed.groups = []; ed.players = [];
  names.forEach((name, i) => { if (i % 4 === 0) ed.groups.push({id: 'g' + rid(4), start: 1}); ed.players.push({id: 'p' + rid(6), name, g: ed.groups[ed.groups.length-1].id}); });
}

        + Array.from({length:18}, (_, i) => `<option value="${i+1}" ${g.start === i+1 ? 'selected' : ''}>${startLabel(i+1)}</option>`).join('') + `</select></label></div>`;
      for (const p of ps){

/* フォーム操作。構造が変わったら true を返す（再描画が必要） */
function edInput(e, ed){ const t = e.target;
  if (t.dataset.ed){ ed[t.dataset.ed] = t.value; return; }
  if (t.dataset.pname){ const p = ed.players.find(x => x.id === t.dataset.pname); if (p) p.name = t.value; } }
function edChange(e, ed){ const t = e.target;
  if (t.dataset.gstart){ const g = ed.groups.find(x => x.id === t.dataset.gstart); if (g) g.start = +t.value; return false; }
  if (t.dataset.pg){ const p = ed.players.find(x => x.id === t.dataset.pg); if (p){ p.g = t.value; ed.players = ed.groups.flatMap(g => ed.players.filter(x => x.g === g.id)); } return true; }
  return false; }
async function edClick(e, ed, hasScores){ const t = e.target; let b;
  if ((b = t.closest('[data-par]'))){ const i = +b.dataset.par; ed.pars[i] = ed.pars[i] >= 6 ? 3 : ed.pars[i] + 1; return true; }
  if (t.closest('[data-split]')){
    if (!ed.bulk.trim()){ await ask('参加者名を1行に1名ずつ入力してください。', 'OK', ''); return false; }
    if (ed.players.length && !(await ask('現在の組分けを消して、名簿から組分けをやり直しますか？', 'やり直す'))) return false;
    edSplit(ed); return true; }
  if (t.closest('[data-addg]')){ ed.groups.push({id: 'g' + rid(4), start: 1}); return true; }
  if ((b = t.closest('[data-gdel]'))){ ed.groups = ed.groups.filter(g => g.id !== b.dataset.gdel); return true; }
  if ((b = t.closest('[data-pdel]'))){ const p = ed.players.find(x => x.id === b.dataset.pdel); if (!p) return false;
    const warn = hasScores && hasScores(p.id) ? `${p.name || 'この参加者'} を削除しますか？\n入力済みのスコアも削除されます（「変更を保存」を押すと確定）。` : (p.name ? `${p.name} を削除しますか？` : '');
    if (warn && !(await ask(warn, '削除する'))) return false;
    ed.players = ed.players.filter(x => x.id !== p.id); return true; }
  return false; }
function edValidate(ed, mode){
  if (!ed.name.trim()) return 'コンペ名を入力してください。';
  if (!ed.players.length) return mode === 'create' ? '参加者名を入力して「4名ずつ組分けする」を押してください。' : '参加者が1名もいません。';
  if (ed.players.some(p => !p.name.trim())) return '名前が空欄の参加者がいます。入力するか、×で削除してください。';
  if (mode === 'create' && ed.pw.length < 6) return '幹事パスワードを6文字以上で入力してください。';
  return ''; }
function edToPub(ed){
  const groups = {}, players = {};
  const used = ed.groups.filter(g => ed.players.some(p => p.g === g.id));
  used.forEach((g, i) => groups[g.id] = {n: i + 1, start: g.start});
  ed.players.forEach((p, i) => players[p.id] = {name: p.name.trim(), g: p.g, o: i + 1});
  return {name: ed.name.trim(), date: ed.date || '', course: ed.course.trim(), pars: ed.pars.join(''), groups, players};
}

        if (!res.ranked.length){ await ask('18ホールすべて入力済みの人がいないため、計算できません。', 'OK', ''); return; }
        for (const id of Object.keys(fin.rows)) fin.rows[id] = {rank: '', hc: '', net: ''};
        for (const r of res.ranked) fin.rows[r.id] = {rank: String(r.rank), hc: fmt1(r.hc10), net: fmt1(r.net10)};
        calcMsg = {kind: res.skipped.length ? 'warn' : 'ok', text: `${res.ranked.length}名を計算しました。内容を確認して「保存する」を押してください。` + (res.skipped.length ? `（18ホール未入力のため対象外：${res.skipped.map(r => r.name).join('、')}）` : '')};
        formMsg = null; renderTab(); const c = el.querySelector('#rankCard'); if (c) c.scrollIntoView({block: 'start'}); return; }
      if (t.closest('[data-openresult]')){
        if (snapOf() !== baseSnap){ await ask('保存していない変更があります。\n先に「保存する」を押してから開いてください。', 'OK', ''); return; }
        location.hash = `r-${cid}`; return; }
    }
    if (t.closest('#saveFinal') && fin){
      const rows = {}; const bad = [];
      const z = v => String(v ?? '').trim().replace(/[０-９．－]/g, c => c === '．' ? '.' : c === '－' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      for (const p of sortedPlayers(pub)){ const r = fin.rows[p.id] || {}; const rk = z(r.rank), net = z(r.net), hc = z(r.hc);
        if (rk === '' && net === '' && hc === '') continue;
        if (!/^\d+$/.test(rk) || +rk < 1 || (net !== '' && !/^\d{1,3}(\.\d{1,2})?$/.test(net)) || (hc !== '' && !/^-?\d{1,2}(\.\d{1,2})?$/.test(hc))){ bad.push(p.name); continue; }
        rows[p.id] = {rank: +rk, ...(net !== '' ? {net} : {}), ...(hc !== '' ? {hc} : {})}; }
      if (bad.length){ formMsg = {kind: 'err', text: `入力を確認してください：${bad.join('、')}（順位は数字、HDCP・NETは 21.6 のような数字）`}; renderTab(); return; }
      if (fin.published && !Object.keys(rows).length){ formMsg = {kind: 'err', text: '公開するには、順位を入力するか「新ペリアを計算する」を押してください。'}; renderTab(); return; }
      /* 設定・隠しホール・未公開の結果は幹事専用の領域（private）へ。参加者が読める領域（pub）には、公開したときだけ結果を書く */
      const privFinal = {kind: fin.kind, holes: fin.holes, cap: fin.cap, maxHc: fin.maxHc, tie: fin.tie, rows};
      const pubFinal = {closed: fin.closed, published: fin.published};
      { const bgT = bestGrossOf(pub, scores, null).tied; const sel = bgT.filter(p => fin.bg[p.id]);
        if (bgT.length > 1 && !sel.length){ formMsg = {kind: 'err', text: 'ベスグロの人を1人以上選んでください。'}; renderTab(); const mm = el.querySelector('#formMsg'); if (mm) mm.scrollIntoView({block: 'center'}); return; }
        if (bgT.length > 1 && sel.length < bgT.length){ pubFinal.bg = {}; for (const p of sel) pubFinal.bg[p.id] = true; } }   /* 全員のときは何も保存しない（＝同打数は全員） */
      if (fin.published){ pubFinal.rows = rows; pubFinal.kind = fin.kind; if (fin.reveal && hiddenList(fin.holes).length){ pubFinal.reveal = true; pubFinal.holes = fin.holes; } }
      calcMsg = null;
      await act(() => store.update(`comps/${cid}`, {'private/final': privFinal, 'pub/final': pubFinal}), fin.published ? '保存して公開しました。参加者の画面に反映されます。' : '保存しました（未公開：参加者には見えません）。', () => { baseSnap = snapOf(); }); return; }
    if (tab === 'settings' && ed){ const r = await edClick(e, ed, hasScores); if (r) renderTab(typeof r === 'string' ? r.slice(6) : null); }
  };
  async function enter(){
    priv = await withTimeout(store.get(P(cid, 'private')), 15000);
    if (!alive()) return;
    phase = 'ok'; ls.set('asec:' + cid, sec);   /* この端末では、次から「戻る」などで管理画面を開き直せるようにする */
    offs.push(store.watch(P(cid, 'pub'), v => { if (!v) return; pub = v; if (tab === 'status') render(); else { const t = el.querySelector('.bar-s'); if (t) t.textContent = pub.name || ''; } }, () => {}));
    offs.push(store.watch(P(cid, 'scores'), v => { scores = v || {}; if (tab === 'status') renderTab(); }, () => {}));
    offs.push(store.watch(P(cid, 'private'), v => { if (v){ priv = v; if (tab === 'status') renderTab(); } }, () => {}));
    render();
  }
  (async () => {
    try{
      pub = await withTimeout(store.get(P(cid, 'pub')), 15000);
      if (!alive()) return;
      if (!pub){ phase = 'none'; render(); return; }
      if (!sec){ phase = 'nosec'; render(); return; }
      try{ await withTimeout(store.uid(), 15000); }catch(x){ const m = authSetupMsg(x); if (m && alive()){ phase = 'setup'; loginErr = m; render(); return; } throw x; }
      try{ await enter(); }catch(x){ if (!alive()) return; if (isDenied(x)){ phase = 'login'; render(); } else throw x; }
    }catch(x){ console.error(x); if (!alive()) return; phase = 'neterr'; render(); }
  })();
  render();
  return () => { offs.forEach(f => f()); };
}

boot();
</script>
</body>
</html>
